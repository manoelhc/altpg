[package]
name = "altpg"
version = "0.1.0"
edition = "2021"

[lib]
name = "altpg"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
postgres = { version = "0.19", features = ["with-chrono-0_4", "with-serde_json-1"] }
chrono = "0.4"
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
